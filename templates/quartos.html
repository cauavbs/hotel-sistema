{% extends "base.html" %}
{% block titulo %}Quartos - Hotel{% endblock %}
{% block cabecalho %}Quartos{% endblock %}
{% block conteudo %}
<section class="card full-width" style="border-top:5px solid #0f766e;">
    <h2>🛏️ Cadastrar Quarto</h2>
    <form id="form"><div class="grade-form">
        <div><label>Número</label><input id="numero" required placeholder="Ex: 101"></div>
        <div><label>Nome / tipo</label><input id="nome" placeholder="Ex: Casal com varanda"></div>
        <div><label>Capacidade (hóspedes)</label><input type="number" id="capacidade" min="1" value="2" required></div>
    </div><button type="submit" style="margin-top:18px;">Salvar quarto</button></form>
</section>
<section class="card full-width"><h2>Quartos cadastrados</h2>
    <div class="rolagem"><table class="tabela cartoes"><thead><tr><th>Número</th><th>Nome / tipo</th><th>Capacidade</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/quartos.js') }}"></script>{% endblock %}
